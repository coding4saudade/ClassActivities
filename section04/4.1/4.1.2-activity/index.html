<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>The weather is bad in the Ozarks</title>
</head>
<body>
    <h1> Holy Crap it's bad out here</h1>
    <img src="/mickymouse.jpg" alt="Mickey Mouse braving a storm" />

    <p>If something happens to me, know that I liked you all. Things I wish I brought with me:</p>

    <ul>
      <li>A rubber ducky </li>  
      <li> A rain coat</li>
      <li> <a href= "https://preppykitchen.com/waffle-recipe/"> waffles </a></li>
    </ul>

    <div> Things I am glad a have currently</div>

    <ul>
        <li> Internet access</li>
        <li> Food in my belly</li>
        <li> Great company (hanging out with an old <a href="https://dictionary.cambridge.org/us/dictionary/english/friend"> friend</a>)</li>
    </ul>
</body>
</html>
